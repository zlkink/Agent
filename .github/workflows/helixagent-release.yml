name: RamiCore Release

# Cross-platform desktop app + installers, mirroring the original Prometheus
# release pipeline: GitHub builds every platform, signs nothing it cannot, and
# attaches installers plus portable archives to the release.
on:
  push:
    tags: ["ramicore-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: helixagent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
            bundles: nsis,msi
            target: ""
          - name: Linux x64
            os: ubuntu-22.04
            goos: linux
            goarch: amd64
            ext: ""
            bundles: deb,appimage
            target: ""
          - name: macOS Apple Silicon
            # GitHub's arm64 macOS runner queue currently cancels jobs without
            # assigning a runner; build the same arm64 bundle on the Intel image.
            os: macos-15-intel
            goos: darwin
            goarch: arm64
            ext: ""
            bundles: app
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: server-go/desktop-shell/src-tauri

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      - name: Build web UI
        run: pnpm --filter @prometheus/web build

      - name: Build Go host
        shell: bash
        run: |
          set -eu
          STAGE="server-go/desktop-shell/src-tauri/bin"
          mkdir -p "$STAGE"
          (cd server-go && GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w" -o "desktop-shell/src-tauri/bin/RamiCore${{ matrix.ext }}" ./cmd/prometheus)

      - name: Stage web, sidecars and plugin host
        shell: bash
        run: |
          set -eu
          STAGE="server-go/desktop-shell/src-tauri/bin"
          rm -rf "$STAGE/web" "$STAGE/node"
          cp -R apps/web/dist "$STAGE/web"
          mkdir -p "$STAGE/node"
          cp -R server-go/node/agent-host "$STAGE/node/agent-host"
          cp -R server-go/node/plugin-host "$STAGE/node/plugin-host"
          rm -rf "$STAGE/node/plugin-host/node_modules"
          mkdir -p "$STAGE/node/plugin-host/node_modules"
          # The plugin host only needs typebox at runtime; LanceDB/PI are optional.
          TMP="$(mktemp -d)"
          printf '{"private":true}\n' > "$TMP/package.json"
          (cd "$TMP" && npm install --no-audit --no-fund --omit=dev --no-save typebox@1.3.27)
          cp -R "$TMP/node_modules/typebox" "$STAGE/node/plugin-host/node_modules/"
          node server-go/desktop-shell/patch-web.mjs apps/web/dist server-go/desktop-shell/web

      - name: Build desktop app and installers
        shell: bash
        working-directory: server-go/desktop-shell
        run: |
          TARGET_ARG=""
          if [ -n "${{ matrix.target }}" ]; then TARGET_ARG="--target ${{ matrix.target }}"; fi
          pnpm dlx @tauri-apps/cli@2 build --config src-tauri/tauri.conf.json --bundles ${{ matrix.bundles }} $TARGET_ARG

      - name: Assemble portable package and artifacts
        shell: bash
        run: |
          set -eu
          STAGE="server-go/desktop-shell/src-tauri/bin"
          OUT="server-go/build-artifacts"
          rm -rf "$OUT"
          mkdir -p "$OUT/installers" "$OUT/portable/RamiCore"
          P="$OUT/portable/RamiCore"
          TARGET_ROOT="server-go/desktop-shell/src-tauri/target"
          if [ -n "${{ matrix.target }}" ]; then TARGET_ROOT="$TARGET_ROOT/${{ matrix.target }}"; fi

          find $TARGET_ROOT/release/bundle -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.app.tar.gz' \) \
            -exec cp -v {} "$OUT/installers/" \;

          if [ "${RUNNER_OS}" = "macOS" ]; then
            APP="$(find $TARGET_ROOT/release/bundle/macos -maxdepth 1 -name '*.app' | head -n1)"
            test -n "$APP"
            chmod +x "$APP/Contents/Resources/bin/RamiCore"
            chmod +x "$APP/Contents/MacOS/"*
            # An unsigned/ad-hoc-broken bundle is reported by Gatekeeper as
            # "damaged". Re-sign everything after the resources were copied.
            codesign --force --sign - "$APP/Contents/Resources/bin/RamiCore"
            codesign --force --deep --sign - "$APP"
            codesign --verify --deep --strict "$APP"
            rm -f "$OUT/installers/"*.dmg
            VERSION="$(node -p "require('./server-go/desktop-shell/src-tauri/tauri.conf.json').version")"
            ARCH="${{ matrix.goarch }}"; [ "$ARCH" = "amd64" ] && ARCH=x64; [ "$ARCH" = "arm64" ] && ARCH=aarch64
            # hdiutil -srcfolder copies the folder's contents, so stage the .app
            # (plus the usual Applications shortcut) instead of pointing it at
            # the bundle itself; otherwise the DMG has loose executable files.
            DMGROOT="$(mktemp -d)"
            cp -R "$APP" "$DMGROOT/"
            ln -s /Applications "$DMGROOT/Applications"
            hdiutil create -volname "RamiCore" -srcfolder "$DMGROOT" -ov -format UDZO \
              "$OUT/installers/RamiCore_${VERSION}_${ARCH}.dmg"
            rm -rf "$DMGROOT"
            # Portable macOS download is the signed .app itself.
            rm -rf "$P"
            mkdir -p "$P"
            cp -R "$APP" "$P/RamiCore.app"
            cp server-go/package/README.md "$P/README.md"
          else
            cp "$STAGE/RamiCore${{ matrix.ext }}" "$P/"
            cp -R "$STAGE/web" "$P/web"
            cp -R "$STAGE/node" "$P/node"
            cp server-go/package/README.md "$P/README.md"
            DESKTOP="$TARGET_ROOT/release/RamiCore Desktop${{ matrix.ext }}"
            if [ ! -f "$DESKTOP" ]; then
              DESKTOP="$TARGET_ROOT/release/helixagent-desktop${{ matrix.ext }}"
            fi
            if [ ! -f "$DESKTOP" ]; then
              DESKTOP="$TARGET_ROOT/release/RamiCore${{ matrix.ext }}"
            fi
            cp "$DESKTOP" "$P/RamiCore Desktop${{ matrix.ext }}"
          fi

          SUFFIX="${{ matrix.name }}"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path '$P' -DestinationPath '$OUT/RamiCore-$SUFFIX.zip'"
          else
            tar -C "$OUT/portable" -czf "$OUT/RamiCore-$SUFFIX.tar.gz" RamiCore
          fi
          rm -rf "$OUT/portable"
          ls -lh "$OUT" "$OUT/installers"

      - uses: actions/upload-artifact@v7
        with:
          name: helixagent-${{ matrix.os }}-${{ matrix.goarch }}
          path: server-go/build-artifacts/**
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/ramicore-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: RamiCore ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/installers/*
          fail_on_unmatched_files: true
