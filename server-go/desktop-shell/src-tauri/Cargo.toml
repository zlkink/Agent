[package]
name = "ramicore-desktop"
version = "0.30.42"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ramicore_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
base64 = "0.22"
tar = "0.4"
flate2 = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
sha2 = "0.10"
futures-util = "0.3"
tokio = { version = "1", features = ["time"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSNotification", "NSObject", "block2"] }
block2 = "0.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[dependencies.tauri-plugin-notification]
version = "2"

[dependencies.tauri-plugin-opener]
version = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
